name: Release · prepare

# Manually cut a release: finalize the CHANGELOG for the next version and open a
# release PR from `development` into the protected `master` branch. Merging that
# PR triggers `release-publish.yml` (tag + GitHub Release + mergeback).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  checks: read

# Serialize releases: never let two prepare runs race on the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Ensure CI is green on the development head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Checking 'Python package' checks for $sha"
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            --jq '[.check_runs[] | select(.name | test("format|lint|typecheck|tests|Python package"; "i"))] | if length == 0 then "missing" elif any(.conclusion != "success") then "failed" else "success" end')"
          echo "CI status: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::development head is not green (${conclusion}); refusing to release"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Finalize CHANGELOG
        id: finalize
        run: uv run python scripts/release.py --bump "${{ inputs.bump }}"

      - name: Open release PR
        env:
          # PAT so the PR is created without requiring the "Allow GitHub Actions
          # to create and approve pull requests" repo setting.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.finalize.outputs.version }}
          NOTES: ${{ steps.finalize.outputs.notes }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "chore(release): v${VERSION}"
          git push --force-with-lease origin "${branch}"
          gh pr create \
            --base master \
            --head "${branch}" \
            --title "Release v${VERSION}" \
            --body "${NOTES}"
